name: Release

# A tag vX.Y.Z-beta.N on main uploads a test build of both apps: iOS to
# TestFlight, Android to Google Play's internal testing. A tag vX.Y.Z
# uploads the release builds: App Store version X.Y.Z is prepared, and a
# draft production release waits in the Play Console. Both apps get the
# same build number (the Android versionCode), the next one App Store
# Connect has not seen, so the Android job follows the iOS upload.
# The app is archived, signed with the team's Apple Distribution
# certificate (from the secrets, in a keychain of its own) and uploaded by
# scripts/release/release.sh, the same script the maintainer can run on his
# Mac, with an App Store Connect API key. Apple's cloud signing is not used:
# it writes the certificate name "Ruben Daniël Talstra" decomposed into the
# app's designated requirement, which App Store Connect rejects. The build number is
# the next one App Store Connect has not seen. When the build is processed,
# the changelog becomes TestFlight's What to Test and, for a final version,
# the App Store's What's New; the version gets the build, and the
# maintainer submits it for review in App Store Connect. docs/releasing.md
# has the procedure and the secrets. Without the secrets (as in a fork) the
# lane stops in its first job and says which ones are missing.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  plan:
    name: tag matches version and changelog, secrets present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      final: ${{ steps.plan.outputs.final }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release/check-version.sh "$TAG"
          version="${TAG#v}"
          final=true
          case "$TAG" in *-beta.*) final=false ;; esac
          { echo "version=${version%%-beta.*}"; echo "final=$final"; } >> "$GITHUB_OUTPUT"
      - name: the release secrets exist
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DISTRIBUTION_P12: ${{ secrets.DISTRIBUTION_P12 }}
          DISTRIBUTION_P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          for name in ASC_KEY ASC_KEY_ID ASC_ISSUER_ID DISTRIBUTION_P12 DISTRIBUTION_P12_PASSWORD \
            ANDROID_UPLOAD_KEYSTORE ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if ((${#missing[@]})); then
            echo "::error title=Release secrets missing::${missing[*]} not set in $GITHUB_REPOSITORY. The release needs the App Store Connect API key, the Apple Distribution certificate, the Android upload key and the Google Play service account; see docs/releasing.md."
            exit 1
          fi
          echo "ok: every release secret is set"

  upload:
    name: archive, sign, upload, notes
    needs: plan
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      build-number: ${{ steps.build.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache on a publishing lane: nothing an untrusted run wrote
      # may reach a release build.
      - name: the API key, in the runner's temporary directory
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY" > "$RUNNER_TEMP/asc-key.p8"
      - name: the Apple Distribution certificate, in a keychain of its own
        env:
          P12: ${{ secrets.DISTRIBUTION_P12 }}
          P12_PASSWORD: ${{ secrets.DISTRIBUTION_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          umask 077
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 5400 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          read -r -a existing <<<"$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/distribution.p12"
          security find-identity -v -p codesigning "$keychain"
      - name: the next build number
        id: build
        env:
          ASC_KEY_FILE: ${{ runner.temp }}/asc-key.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          number="$(swift scripts/release/app-store-connect.swift next-build-number)"
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "no build number: $number" >&2; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "build number $number"
      - name: release.sh (archive, sign, upload)
        env:
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          ASC_KEY_FILE: ${{ runner.temp }}/asc-key.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: bash scripts/release/release.sh
      # The symbols, for symbolicating a crash report from outside App Store
      # Connect (the upload sends them to Apple as well).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsyms-${{ steps.build.outputs.number }}
          path: build/release/RotaryYEP.xcarchive/dSYMs/
          if-no-files-found: error
      - name: the notes in App Store Connect
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          FINAL: ${{ needs.plan.outputs.final }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
          ASC_KEY_FILE: ${{ runner.temp }}/asc-key.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          bash scripts/release/notes.sh "$TAG" ios > "$RUNNER_TEMP/notes.md"
          store=()
          if [ "$FINAL" = true ]; then store=(--app-store); fi
          swift scripts/release/app-store-connect.swift notes "$VERSION" "$BUILD_NUMBER" "$RUNNER_TEMP/notes.md" ${store[@]+"${store[@]}"}
          echo "Build $BUILD_NUMBER of $VERSION is in TestFlight." >> "$GITHUB_STEP_SUMMARY"
          # An if, not "test && echo": a false test as the last command would fail the step.
          if [ "$FINAL" = true ]; then
            echo "App Store version $VERSION has it; submit it for review in App Store Connect." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: remove the API key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-key.p8"
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true

  android:
    name: bundle, sign, upload to Google Play
    needs: [plan, upload]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Gradle runs on JDK 25 (android/gradle/gradle-daemon-jvm.properties).
      # No Gradle cache on a publishing lane: nothing an untrusted run wrote
      # may reach a release build.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: the upload key and the service account, in the runner's temporary directory
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/play-service-account.json"
      - name: the App Bundle, signed with the upload key
        working-directory: android
        env:
          BUILD_NUMBER: ${{ needs.upload.outputs.build-number }}
          ANDROID_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "no build number from the iOS upload: '$BUILD_NUMBER'" >&2; exit 1; }
          ./gradlew :app:bundleRelease -PversionCode="$BUILD_NUMBER" --console=plain --no-configuration-cache
      # R8's mapping, for reading a crash report from outside the Play Console
      # (the upload sends it to Google as well).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-mapping-${{ needs.upload.outputs.build-number }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: upload to Google Play with the notes
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          FINAL: ${{ needs.plan.outputs.final }}
          BUILD_NUMBER: ${{ needs.upload.outputs.build-number }}
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/play-service-account.json
        run: |
          bash scripts/release/notes.sh "$TAG" android > "$RUNNER_TEMP/notes-android.md"
          track=internal
          status=completed
          if [ "$FINAL" = true ]; then
            track=production
            status=draft
          fi
          python3 -I scripts/release/google-play.py upload \
            --bundle android/app/build/outputs/bundle/release/app-release.aab \
            --mapping android/app/build/outputs/mapping/release/mapping.txt \
            --track "$track" --status "$status" \
            --name "$VERSION ($BUILD_NUMBER)" --notes "$RUNNER_TEMP/notes-android.md"
          echo "Build $BUILD_NUMBER of $VERSION is on Google Play's $track track." >> "$GITHUB_STEP_SUMMARY"
          if [ "$FINAL" = true ]; then
            echo "The production release is a draft; roll it out in the Play Console." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: remove the upload key and the service account
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-service-account.json"
